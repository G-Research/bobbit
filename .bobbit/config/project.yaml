sandbox: docker
sandbox_image: bobbit-agent
base_ref: origin/main
components:
  - name: bobbit
    repo: .
    worktree_setup_command: npm ci --prefer-offline --no-audit --no-fund
    commands:
      build: npm run build
      check: npm run check
      unit: npm run test:unit
      browser: npm run test:browser
      e2e: npm run test:e2e
    config:
      qa_start_command: BOBBIT_NO_OPEN='1' BOBBIT_LLM_REVIEW_SKIP='1'
        BOBBIT_SKIP_NPM_CI='1' PORT=$PORT WORK_DIR=$WORK_DIR
        BOBBIT_DIR=$WORK_DIR/.bobbit BOBBIT_NO_OPEN=1 BOBBIT_LLM_REVIEW_SKIP=1
        BOBBIT_SKIP_NPM_CI=1 node dist/server/cli.js --host 127.0.0.1 --port
        $PORT --no-tls --auth --cwd $WORK_DIR
      qa_build_command: npm run build
      qa_health_check: http://127.0.0.1:$PORT/api/health
      qa_browser_entry: http://127.0.0.1:$PORT/?token=$TOKEN
      qa_max_duration_minutes: "10"
      qa_max_scenarios: "5"
workflows:
  general:
    id: general
    name: General
    description: Lightweight workflow for general-purpose goals
    gates:
      - id: design-doc
        name: Design Document
        content: true
        inject_downstream: true
        verify:
          - name: Comparative design review
            type: llm-review
            role: architect
            prompt: >-
              Review this design document for structure, clarity, comparative
              reasoning, and completeness.


              For every non-trivial change, FAIL unless the design:


              1. Compares two materially different approaches that preserve the
              same scope and acceptance criteria


              2. Includes a minimal-composition option that names exact
              well-tested existing code and its protecting tests


              3. Inventories and justifies every new branch, state owner,
              transformation, API, abstraction, and dependency as added defect
              surface


              4. Compares data/control flow, expected files, failure modes, and
              test seams


              5. Selects the smallest robust solution and explains why the
              rejected option lost


              A quick-fix exemption is acceptable only for one local behavior
              following an obvious established pattern with no new public API,
              state owner, persistence, auth, dependency, or cross-layer flow;
              the design must state why comparison is unnecessary. Do not force
              reuse where contracts, ownership, or lifecycle differ, and do not
              demand speculative generalization or adjacent features.


              Regardless of comparative-design exemption, every design must list
              file changes with specific descriptions, define specific and
              testable acceptance criteria, cover edge/error handling, and
              include an E2E test plan that validates the user journey
              end-to-end.

              Treat this as a revision-ready content review. A FAIL is valid
              only for an explicit unmet goal requirement or concrete regression
              and is invalid without a complete author-ready revision packet for
              every blocker. For each blocker, identify the exact artifact
              location; explain the goal-linked gap and practical consequence;
              provide concrete replacement wording, an outline, contract,
              data-flow/state sequence, acceptance criterion, example, or
              test-plan case; state consistency edits and constraints; include
              credible alternatives with tradeoffs only when they exist; and
              separate required edits from bounded improvements. Require
              implementable contracts and testable acceptance criteria only to
              the level needed by the approved goal, not exhaustive pseudocode,
              formal proof, or speculative hardening.
          - name: Gap analysis
            type: llm-review
            role: spec-auditor
            prompt: >-
              Compare the goal specification to this design document.


              The goal spec is:


              {{goal_spec}}


              Identify:


              1. Requirements in the goal spec not addressed in the design


              2. Acceptance criteria not covered by the proposed changes


              3. Edge cases mentioned in the goal but missing from the design


              4. Any contradictions between the goal and the design


              5. Compared approaches that do not target the same acceptance
              criteria and constraints


              6. Scope expansion added to justify an abstraction or possible
              future reuse


              Use your tools to read the design document content from the
              signal.

              Treat this as a revision-ready content review. A FAIL is valid
              only for an explicit unmet goal requirement or concrete regression
              and is invalid without a complete author-ready revision packet for
              every blocker. For each blocker, identify the exact artifact
              location; explain the goal-linked gap and practical consequence;
              provide concrete replacement wording, an outline, contract,
              data-flow/state sequence, acceptance criterion, example, or
              test-plan case; state consistency edits and constraints; include
              credible alternatives with tradeoffs only when they exist; and
              separate required edits from bounded improvements. Require
              implementable contracts and testable acceptance criteria only to
              the level needed by the approved goal, not exhaustive pseudocode,
              formal proof, or speculative hardening.
      - id: implementation
        name: Implementation
        depends_on:
          - design-doc
        verify:
          - name: Build
            type: command
            phase: 0
            timeout: 600
            component: bobbit
            command: build
          - name: Type check passes
            type: command
            phase: 1
            component: bobbit
            command: check
          - name: Unit tests
            type: command
            phase: 1
            component: bobbit
            command: unit
          - name: Browser tests
            type: command
            phase: 2
            timeout: 900
            component: bobbit
            command: browser
          - name: E2E tests
            type: command
            phase: 3
            timeout: 900
            component: bobbit
            command: e2e
          - name: Spec and regression conformance
            type: llm-review
            role: spec-auditor
            phase: 3
            prompt: >-
              Compare the goal specification below, available upstream design or
              issue analysis, implementation, and tests on branch {{branch}}
              against origin/{{baseBranch}}.

              {{goal_spec}}

              Ignore documentation-only gaps. Identify unmet behavior,
              acceptance criteria, regressions, contradictions, and missing
              regression coverage. Every blocker must include
              implementation-ready remediation and focused tests that prove the
              fix.

              This phase-3 implementation review does not own optional phase-4
              QA or the downstream Ready-to-Merge gate. Defer QA when
              configured, branch push, base synchronization, and PR creation to
              those stages. Concrete implementation defects remain in scope.
          - name: Integrated implementation review
            type: llm-review
            role: code-reviewer
            phase: 3
            prompt: >-
              Review the implementation on branch {{branch}} versus
              origin/{{baseBranch}}. Cover correctness, error handling, edge and
              mixed states, concurrency and lifecycle, cross-layer interactions,
              maintainability, regression coverage, and independently verifiable
              bugs.

              This review runs before the downstream Documentation gate. Ignore
              documentation-only gaps — including missing or outdated docs,
              README or design-document updates, and code comments. Concrete
              implementation defects remain in scope.

              Deduplicate findings by root cause. For each blocker, provide an
              exact minimal fix and focused tests that independently verify it.
          - name: Security review
            type: llm-review
            role: security-reviewer
            phase: 3
            prompt: >-
              Review changed trust boundaries, authentication and authorization,
              validation and injection, secrets, destructive or resource
              ownership, dependency risk, and security-relevant races on branch
              {{branch}} versus origin/{{baseBranch}}.

              This review runs before the downstream Documentation gate. Defer
              documentation-only gaps — including missing or outdated docs,
              README or design-document updates, and code comments — to that
              gate. Concrete in-scope security defects remain in scope.

              For each blocker, provide minimal remediation plus abuse and
              regression tests that verify the fix.
      - id: documentation
        name: Documentation
        depends_on:
          - implementation
        verify:
          - name: Documentation coverage
            type: llm-review
            prompt: >-
              Review documentation for the changes on branch {{branch}} vs
              origin/{{baseBranch}}.


              Run `git diff origin/{{baseBranch}}...{{branch}} -- .
              ':!package-lock.json'` to see all changes.


              Read AGENTS.md, README.md, and docs/. Verify every user-facing
              feature, API endpoint, config option, or behavior change is
              documented; stale docs are updated; documentation placement is
              appropriate; and new docs have good hierarchy, resilience, WHY,
              and big-picture context.

              Treat this as a revision-ready documentation review. A FAIL is
              valid only for an explicit unmet goal requirement or concrete
              change-introduced regression and is invalid without an
              author-ready revision packet for every blocker. For each blocker,
              name exact documentation paths and sections; identify the stale or
              missing claim and its goal-linked consequence; give proposed
              replacement wording or outline with relevant examples or links;
              state related cross-section edits and constraints; include
              credible alternatives with tradeoffs only when they exist;
              separate required edits from bounded improvements; and explain how
              to verify the documented behavior against the implementation.

              This review is limited to documentation. Defer branch push, base
              synchronization, and PR creation to the downstream Ready-to-Merge
              gate. Concrete documentation defects remain in scope.
      - id: ready-to-merge
        name: Ready to Merge
        depends_on:
          - documentation
        verify:
          - name: Branch pushed to remote
            type: command
            run: git push origin {{branch}}:refs/heads/{{branch}} && git ls-remote --heads
              origin {{branch}} | grep -q .
          - name: Base ref merged into branch
            type: command
            run: git fetch origin {{baseBranch}} && git merge-base --is-ancestor
              origin/{{baseBranch}} {{branch}}
          - name: PR raised
            type: command
            run: gh pr list --head {{branch}} --base {{baseBranch}} --state open --json url
              -q ".[0].url" | grep -q .
          - name: PR checks pass
            type: command
            phase: 1
            timeout: 3600
            run: gh pr checks "{{branch}}" --watch --interval 10
            failureGuidance: >-
              Inspect the failed checks before acting. If the failure was transient and
              no repository change is required, retry and re-signal this gate. If changes
              are required, fix them and re-signal the earliest passed gate whose
              verified work is affected: Implementation for source code, tests, build
              configuration, or runtime behaviour; Documentation for documentation-only
              changes where that gate exists; or Design/Issue Analysis when accepted
              assumptions change. Re-signalling a passed gate invalidates its downstream
              gates. Choose based on the planned remediation, not merely the check
              failure.
  pr-review:
    id: pr-review
    name: PR Review
    description: Multi-dimensional review of a GitHub PR. Agent extracts the PR
      number from the goal spec, fetches it locally, runs five independent
      review gates, then posts an aggregated review comment back to GitHub.
    gates:
      - id: fetch-pr
        name: Fetch PR
        content: true
        inject_downstream: true
        metadata:
          pr_number: GitHub PR number (integer, e.g. 1234)
          pr_url: Full PR URL for reference
          head_sha: Head commit SHA captured at fetch time
        verify:
          - name: PR checked out locally
            type: command
            run: gh pr checkout {{fetch-pr.meta.pr_number}} && git rev-parse HEAD
          - name: PR metadata accessible
            type: command
            run: gh pr view {{fetch-pr.meta.pr_number}} --json
              number,title,headRefName,baseRefName,url | grep -q '"number"'
      - id: code-quality
        name: Code Quality Review
        content: true
        inject_downstream: true
        depends_on:
          - fetch-pr
        verify:
          - name: Code quality review report quality
            type: llm-review
            role: code-reviewer
            prompt: "Verify the quality of the signaled code-quality review report for PR
              #{{fetch-pr.meta.pr_number}}. PASS if it is concrete, actionable,
              includes file:line/severity for findings or a reasoned no-issues
              result, and covers correctness, error handling, edge cases, style,
              and maintainability. Do not fail because the PR itself has bugs."
      - id: security
        name: Security Review
        content: true
        inject_downstream: true
        depends_on:
          - fetch-pr
        verify:
          - name: Security review report quality
            type: llm-review
            role: security-reviewer
            prompt: "Verify the quality of the signaled security review report for PR
              #{{fetch-pr.meta.pr_number}}. PASS if it names considered risk
              classes and gives actionable findings with
              severity/file:line/remediation or a reasoned no-issues result. Do
              not fail because the PR itself has security issues."
      - id: test-coverage
        name: Test Coverage
        content: true
        inject_downstream: true
        depends_on:
          - fetch-pr
        verify:
          - name: Test coverage review report quality
            type: llm-review
            prompt: "Verify the quality of the signaled test-coverage review report for PR
              #{{fetch-pr.meta.pr_number}}. PASS if it maps behavior changes to
              corresponding tests or explicit gaps across relevant test layers.
              Do not fail because the PR has missing tests."
      - id: documentation
        name: Documentation
        content: true
        inject_downstream: true
        depends_on:
          - fetch-pr
        verify:
          - name: Documentation review report quality
            type: llm-review
            prompt: "Verify the quality of the signaled documentation review report for PR
              #{{fetch-pr.meta.pr_number}}. PASS if it identifies undocumented
              features/stale references or notes none, comments on documentation
              quality, and gives actionable remediation. Do not fail because the
              PR has documentation gaps."
      - id: spec-conformance
        name: Spec Conformance
        content: true
        inject_downstream: true
        depends_on:
          - fetch-pr
        verify:
          - name: Spec conformance review report quality
            type: llm-review
            role: spec-auditor
            prompt: "Verify the quality of the signaled spec-conformance review report for
              PR #{{fetch-pr.meta.pr_number}}. PASS if it references the
              source-of-truth spec and lists conformance findings with spec
              quotes, file:line, and severity, or explains why the PR conforms.
              Do not fail because the PR diverges from spec."
      - id: post-review
        name: Post Review to GitHub
        content: true
        depends_on:
          - code-quality
          - security
          - test-coverage
          - documentation
          - spec-conformance
        metadata:
          verdict: "Overall verdict: approve | request-changes | comment"
          review_body_file: Path to a markdown file containing the aggregated review body to post
        verify:
          - name: Aggregated review body exists
            type: command
            run: test -s "{{post-review.meta.review_body_file}}"
          - name: Verdict is valid
            type: command
            run: echo {{post-review.meta.verdict}} | grep -Eq
              '^(approve|request-changes|comment)$'
          - name: Submit review to GitHub
            type: command
            run: gh pr review {{fetch-pr.meta.pr_number}} --{{post-review.meta.verdict}}
              --body-file "{{post-review.meta.review_body_file}}"
          - name: Confirm review posted
            type: command
            run: gh pr view {{fetch-pr.meta.pr_number}} --json reviews -q
              '.reviews[-1].state' | grep -Eq
              '(APPROVED|CHANGES_REQUESTED|COMMENTED)'
