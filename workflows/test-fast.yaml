id: test-fast
name: Test Fast
description: Lightweight workflow for E2E testing with fast verification steps.
hidden: true
gates:
  - id: design-doc
    name: Design Doc
    verify:
      - name: "Content present"
        type: command
        run: "echo ok"

  - id: implementation
    name: Implementation
    depends_on: [design-doc]
    verify:
      - name: "Quick check"
        type: command
        run: "echo ok"
      - name: Systems interaction review
        type: llm-review
        role: systems-reviewer
        phase: 1
        reviewGroup: specialist
        promptRef: bobbit:systems-interaction-review/v1

  - id: ready-to-merge
    name: Ready to Merge
    depends_on: [implementation]
    verify:
      - name: "All gates passed"
        type: command
        run: "echo ok"
