name: review_close
description: "Close matching Markdown reviews or all reviews"
summary: "Close matching Markdown reviews or all reviews"
params: [title?]
provider:
  type: bobbit-extension
  extension: extension.ts
group: Review
detail_docs: |-
  ## Parameters
  | Name | Type | Required | Description |
  |------|------|----------|-------------|
  | title | string | No | Close every review whose review title matches, including the whole review and all its files. Omit to close all reviews in the calling session. |

  If review titles are duplicated, every match closes. Use distinct titles when a later close must select only one review.

  ## Examples
  ```
  review_close(title="Architecture")
  review_close()
  ```
