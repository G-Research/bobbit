name: bobbit_read
description: "Read-only gateway introspection: goals, sessions, projects, tasks, gates, search, maintenance probes."
summary: "Read gateway state (goals/sessions/projects/…)"
params: [operation, goalId?, sessionId?, taskId?, projectId?, workflowId?, q?, type?, limit?, offset?, after?, cursor?, archived?, include?, includeArchived?, view?, probe?]
provider:
  type: bobbit-extension
  extension: extension.ts
group: Bobbit
grantPolicy: allow
docs: |-
  Read-only, gateway-wide introspection. Use compact `list_*` operations to choose an entity id, then inspect that exact entity with its `get_*` operation. Addresses entities by explicit id (not the current goal), so it complements — never replaces — `task_list`/`gate_list`.
detail_docs: >-
  ## Purpose


  A curated, read-only wrapper over the Bobbit gateway REST API. It resolves the
  gateway URL + auth token for you (env `BOBBIT_TOKEN`/`BOBBIT_GATEWAY_URL` or the
  state files) so you never hand-roll `curl`. Every operation is a GET with no
  side effects.


  This tool is **gateway-wide**: it addresses goals/sessions/tasks/gates by
  explicit id, across projects. It is additive to the current-goal tools
  (`task_list`, `gate_list`) — those act on *your* goal; `bobbit_read` inspects
  *any* id.


  ## Parameters


  - `operation` — which read to run (see the catalogue below).

  - Ids: `goalId`, `sessionId`, `taskId`, `projectId`, `workflowId` — supply the
  ones the chosen operation requires.

  - Semantic filters: `q` (free-text list/search filter), `type` (search result
  type), `archived` (list_goals archive opt-in), `include` (list_sessions and
  search archive opt-in, e.g. `archived`), `includeArchived` (REST-style search
  archive opt-in), `view` (goal/Git detail or gates/tasks projection), `probe`
  (maintenance_inspect selector).

  - Shared paging: `limit`, `offset`, `after`, `cursor`. List-style operations
  use `limit=50` and `offset=0` by default, clamp `limit` to a maximum of `200`,
  and return pagination metadata. `search` keeps its search endpoint defaults
  (`limit=20`, maximum `100`) unless you pass `limit` explicitly.

  - REST vs tool paging: paging is forwarded to REST for `list_sessions`,
  `list_goals`, `search`, and `list_gates`. Other list-style operations are
  paged in the tool after the gateway applies semantic filters. REST-paged
  responses are annotated rather than re-sliced; `list_gates` additionally
  enforces the requested bound if an endpoint returns an unsliced array.

  - Cursor aliases: `cursor` is the generic cursor input; `after` is also
  accepted. For `list_gates`, both are numeric absolute positions translated
  to REST `offset`; precedence is `cursor`, then `after`, then `offset`.


  ## Archive visibility (hidden by default)


  Agent-facing list/search reads are **live-only by default**: archived entities
  are never returned unless the caller explicitly opts in. This keeps stale,
  archived goals/sessions out of agent context unless they are actually wanted.
  The filter runs on the tool response *after* the gateway replies, so it also
  strips archived rows from auxiliary arrays that the REST endpoints attach for
  the UI (which the agent surface does not need by default).


  - `list_sessions` — default calls drop any `archived: true` session rows and
  strip the `archivedDelegates` auxiliary array. Pass `include: "archived"` to
  return archived sessions plus the `archivedDelegates` delegate-chain
  enrichment.

  - `list_goals` — default calls drop any `archived: true` goal rows. The tool
  always strips the REST-only `archivedSessions` auxiliary array, including
  when `archived: true` selects archived goals. Use `list_sessions` with
  `include: "archived"` to retrieve archived sessions.

  - `search` — default calls drop any archived hit from `results`. Pass
  `include: "archived"` (or the REST-style `includeArchived: true`) to include
  archived rows in the ranked results.

  This is the agent-facing tool contract. UI clients may explicitly call REST
  `/api/search` with `includeArchived=true` to preserve archived results and
  archived badges; that UI opt-in does not change `bobbit_read.search`'s
  live-only default.

  - Other list operations (`list_projects`, `list_tasks`, `list_gates`, etc.)
  never surface archived rows on their default REST paths, so no extra filtering
  is applied and there is no archive opt-in for them.


  ## Pagination contract


  List-style operations return the endpoint's normal fields plus a
  `pagination` object. The primary item key is preserved (`sessions`, `goals`,
  `projects`, `workflows`, `roles`, `tools`, `gates`, `tasks`, `staff`,
  `servers`, `results`, or probe-specific keys such as `items`, `worktrees`,
  and `sample`). Fallback tool-side paging happens after semantic filtering;
  REST-paged responses are normally annotated rather than re-sliced.


  `pagination` includes:


  - `limit` — effective page size.

  - `offset` and `nextOffset` for offset pages.

  - `cursor` and `nextCursor` for cursor pages.

  - `total` when the gateway/tool can know the total after filtering.

  - `hasMore` — whether another page is available.

  - `mode` — `offset` or `cursor`.

  - `itemKey` — the response field that was paged.

  - `pagedBy` — `rest` when the gateway endpoint paged, `tool` when the tool
  bounded an unpaged endpoint response.


  ### Bounded summary views


  `get_goal` with `view: "summary"` returns only available `id`, `title`,
  `state`, `projectId`, `workflowId`, `parentGoalId`, `rootGoalId`, `paused`,
  `archived`, `archivedAt`, `setupStatus`, `setupError`, `createdAt`, and
  `updatedAt`. It excludes `spec`, workflow detail, paths, config/provider data,
  and branch/merge internals. Omitted and non-summary views, including `full`,
  keep the established detail projection and untruncated spec.


  `goal_git_status` with `view: "summary"` returns one scalar `aggregate` with
  branch/upstream, ahead/behind, change-count, clean/merged/unpushed/partial/
  untracked flags, textual `summary`, and derived `changedFiles`. Available
  freshness fields (`observedAt`, `refreshedAt`, `stale`, `source`, `ageMs`) and
  compact `lastError` remain. Per-file `status` and root/`repos`/`data` aliases
  are omitted. Omitted and non-summary views, including `full`, retain the
  legacy projection and compatibility aliases.


  ### `list_gates` paging


  Paging applies to summary, omitted, and full views; `view` changes item detail,
  not page size. Root `gates` is the sole paged gate collection. Summary output
  retains count-only progress metadata and omits `summary.gates`; `total` is the
  full authorized, goal-scoped count.


  Non-negative integer `cursor` and `after` values are absolute offsets;
  precedence is `cursor`, then `after`, then `offset`. Offset pages return
  `nextOffset` and equivalent `nextCursor` when more rows remain. Cursor pages
  report `mode: "cursor"`, the
  consumed `cursor`, and only `nextCursor`. Terminal pages set `hasMore: false`
  and omit continuation markers. Calls without controls use the list defaults.


  ## Operation catalogue

  | operation | GET path | required | semantic filters / paging |

  |---|---|---|---|

  | `health` | `/api/health` | — | — |

  | `connection_info` | `/api/connection-info` | — | — |

  | `list_goals` | `/api/goals` (`?projectId`, `?archived`, `?q`, paging) | — | `projectId`, `q`, `limit`, `offset`; archived hidden unless `archived=true` (then `after`/`cursor`) |

  | `get_goal` | `/api/goals/:goalId` | `goalId` | `view` (`summary` is bounded; omitted/`full` preserve detail) |

  | `goal_cost` | `/api/goals/:goalId/cost` | `goalId` | — |

  | `goal_git_status` | `/api/goals/:goalId/git-status` | `goalId` | `view` (`summary` is scalar/deduplicated; omitted/`full` preserve legacy output) |

  | `goal_commits` | `/api/goals/:goalId/commits` | `goalId` | `limit` (forwarded to REST) |

  | `goal_pr_status` | `/api/goals/:goalId/pr-status` | `goalId` | — |

  | `list_sessions` | `/api/sessions` (`?include`, `?q`, `?projectId`, paging) | — | `q`, `projectId`, `limit`, `offset`; archived hidden unless `include=archived` (then `after`/`cursor`) |

  | `get_session` | `/api/sessions/:sessionId` | `sessionId` | — |

  | `session_cost` | `/api/sessions/:sessionId/cost` | `sessionId` | — |

  | `search` | `/api/search` (`?q`, `?type`, `?limit`, `?offset`, `?projectId`, `?includeArchived`) | `q` | `q`, `type`, `projectId`, `limit`, `offset`; archived hidden unless `include=archived` / `includeArchived=true` |

  | `list_projects` | `/api/projects` | — | `limit`, `offset` (tool-side fallback) |

  | `get_project` | `/api/projects/:projectId` | `projectId` | — |

  | `list_workflows` | `/api/workflows` (`?projectId`) | `projectId` | `projectId`, `limit`, `offset` (tool-side fallback) |

  | `get_workflow` | `/api/workflows/:workflowId` (`?projectId`) | `workflowId` | `projectId` |

  | `list_roles` | `/api/roles` (`?projectId`) | — | `projectId`, `limit`, `offset` (tool-side fallback) |

  | `list_tools` | `/api/tools` (`?projectId`) | — | `projectId`, `limit`, `offset` (tool-side fallback) |

  | `list_gates` | `/api/goals/:goalId/gates` (`?view`, paging) | `goalId` | `view`, `limit`, `offset`, numeric `cursor`/`after`; root `gates` is canonical |

  | `list_tasks` | `/api/goals/:goalId/tasks` (`?view`) | `goalId` | `view`, `limit`, `offset` (tool-side fallback) |

  | `get_task` | `/api/tasks/:taskId` | `taskId` | — |

  | `list_staff` | `/api/staff` (`?projectId`) | — | `projectId`, `limit`, `offset` (tool-side fallback) |

  | `list_mcp_servers` | `/api/mcp-servers` (`?projectId`) | — | `projectId`, `limit`, `offset` (tool-side fallback) |

  | `maintenance_inspect` | see `probe` below | `probe` | `probe`, supported `projectId`, tool-side paging for large array probes |


  ### Semantic filter audit


  - `projectId` scopes `list_sessions`, `list_goals`, `list_workflows`,
  `get_workflow`, `list_roles`, `list_tools`, `list_staff`, `list_mcp_servers`,
  and supported maintenance probes.

  - `goalId` path-scopes `list_gates` and `list_tasks`; `view` projection is
  applied before paging.

  - `q` filters `list_sessions`, `list_goals`, and `search`; `type` applies only
  to `search`.

  - `include=archived` is the archive opt-in for both `list_sessions` and
  `search`; `archived=true` is the archive opt-in for `list_goals`. Without
  these flags every list/search read is live-only (see “Archive visibility”
  above). `search` also accepts the REST-style `includeArchived=true` as an
  equivalent opt-in.


  ### `maintenance_inspect` probes (`probe=`)

  `orphaned_worktrees` (paged `worktrees`), `orphaned_sessions` (paged
  `sessions`), `expired_archives`, `orphaned_index_rows` (`?projectId`, paged
  `sample`), `worktrees` (paged root `items`), `archived_session_worktrees`
  (paged root `items`), `worktree_pool` (`?projectId`), `sandbox_pool`,
  `sandbox_status` (`?projectId`), `search_stats` (`?projectId`).


  The compact archived-session worktree response uses root `items` as its sole
  worktree collection. Nested session worktrees and worktree aliases are
  suppressed while compact counts and session/group identity remain. Direct
  REST responses are unchanged.


  ## Overlap policy (use the dedicated tool instead)

  - **Transcripts** — do NOT read `/api/sessions/:id/transcript` here; use
  `read_session`.

  - **Current-goal task/gate board** — `list_tasks`/`list_gates` take an
  arbitrary `goalId`; for *your* goal prefer `task_list`/`gate_list`.


  ## Notes / Gotchas

  - List responses are compact discovery views with ids, state, relationships,
  concise diagnostics, timestamps, and pagination. Choose one id and use the
  matching `get_*` operation for useful detail about that exact entity.

  - Intentional compact contract changes: `list_gates` is always bounded and no
  longer repeats `summary.gates`; Git summary has one aggregate and no file
  aliases; worktree inventory probes page canonical root `items`; archived
  worktree output suppresses nested duplicates. Direct REST remains unchanged.

  - On failure, the tool surfaces `{ error, code }` as one readable line
  including the HTTP status.

  - No side effects — safe to call freely.
