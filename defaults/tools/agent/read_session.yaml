name: read_session
description: "List compact message diagnostics, then inspect one exact message or result"
summary: "List or inspect another session's messages"
params: [operation, session_id, offset?, limit?, pattern?, case_sensitive?, context?, message_index?, result_index?]
provider:
  type: bobbit-extension
  extension: extension.ts
group: Agent
renderer: src/ui/tools/renderers/ReadSessionRenderer.ts
docs: |-
  Use `operation: "list"` for compact, paginated message diagnostics. Choose one message or result index, then use `operation: "inspect"` for that exact target.
detail_docs: >-
  ## Workflow


  1. Call `operation: "list"` with a session id. Use `offset` and `limit` for
  pagination; negative offsets index from the end. Optional `pattern`,
  `case_sensitive`, and `context` narrow the compact list.

  2. Choose one zero-based `message_index` and, when needed, one zero-based
  `result_index` from that message.

  3. Call `operation: "inspect"` with that exact index. Message inspection
  returns one sanitized semantic message and result metadata. Adding
  `result_index` returns only a bounded excerpt of that result. Continue a
  truncated result with its `nextOffset` as `offset`; result excerpts default
  to 2,000 characters and accept at most 8,000.


  List output never contains result bodies or provider signatures. Result
  metadata includes normalized status plus complete character, line, and UTF-8
  byte sizes.


  ## Examples


  ```

  read_session(operation="list", session_id="abc-123", offset=-20, limit=20)

  read_session(operation="list", session_id="abc-123", pattern="error", context=1)

  read_session(operation="inspect", session_id="abc-123", message_index=42)

  read_session(operation="inspect", session_id="abc-123", message_index=42, result_index=0, offset=0, limit=2000)

  ```


  Invalid regexes, indexes, bounds, and mixed list/inspect parameters return
  concise structured errors.
