name: read_session
description: "Compact-first, paginated transcript diagnostics with regex filtering and bounded result slices"
summary: "Inspect another session compact-first"
params: [session_id, offset?, limit?, pattern?, case_sensitive?, context?, verbose?, include_tool_results?, result_handle?, result_cursor?, result_limit?]
provider:
  type: bobbit-extension
  extension: extension.ts
group: Agent
renderer: src/ui/tools/renderers/ReadSessionRenderer.ts
docs: |-
  Inspect another session without loading its full transcript. Start with a small compact tail or regex page; use indexes, tool names, normalized statuses, and accurate result sizes to narrow the question. Result bodies are omitted by default. Retrieve only a bounded excerpt using a returned `result_handle`, then continue from its `nextCursor` only when necessary. `verbose: true` or `include_tool_results: true` requires an explicit integer `limit <= 10`; neither flag permits an unbounded result body.
detail_docs: >-
  ## Purpose


  `read_session` is the agent-facing, compact-first transcript reader. It reads
  another session on the same gateway without exposing transcript paths. Direct
  REST/UI transcript behavior is separate and remains backward compatible.


  ## Progressive workflow


  1. Fetch compact session metadata once with `bobbit_read(get_session)`.

  2. Read a small compact tail, or search a stable regex with a small `limit`.

  3. Narrow using message indexes, canonical tool names, normalized statuses,
  and result `chars`/`lines`/`bytes`.

  4. Follow only the returned page continuation; avoid overlapping windows.

  5. If metadata is insufficient, request one bounded excerpt with its returned
  `result_handle`, then continue from `excerpt.nextCursor` only if required.

  6. Stop when the question is answered. Verbose mode is not a discovery
  default.


  ## Parameters


  | Name | Type | Required | Description |

  |------|------|----------|-------------|

  | `session_id` | string | yes | Target session ID. |

  | `offset` | number | no | Default `0`. Negative values index from the end; `-1` selects the last message. With a regex, paging applies to the filtered/context-expanded list. |

  | `limit` | number | no | Ordinary compact reads default to `20`. A heavy flag requires an explicit integer in `[1,10]`. |

  | `pattern` | string | no | Regex over server-side visible text, canonical tool names/full arguments, and full result text. Matching omitted content does not return it. |

  | `case_sensitive` | boolean | no | Default `false`. |

  | `context` | number | no | `0..5`; expands each regex hit by neighbouring transcript messages before paging. |

  | `verbose` | boolean | no | Expanded semantic message blocks. Requires an explicit integer `limit <= 10`; provider replay/signature blobs remain omitted. |

  | `include_tool_results` | boolean | no | Adds only bounded, self-describing result excerpts. Requires an explicit integer `limit <= 10`; never returns an unbounded result body. |

  | `result_handle` | string | no | Stable handle from result metadata selecting one result for a targeted excerpt. |

  | `result_cursor` | number | no | UTF-16 code-unit offset for `result_handle`; default `0`. Use the prior `excerpt.nextCursor` for exact continuation. |

  | `result_limit` | number | no | Requested UTF-16 code units; integer `[1,8192]`, default `4096`. A slice may be shorter to satisfy the transport budget. |


  ## Result metadata and excerpts


  Compact rows retain canonical tool-call names and bounded argument previews.
  Every tool result has one canonical `name`, `status` (`ok`, `error`, or
  `unknown`), accurate `size`, `omitted`, and a retrieval `handle`. Excerpts are
  half-open UTF-16 ranges and include `start`, `end`, `text`, `nextCursor`, and
  `complete`. Raw provider correlation IDs, duplicate aliases, opaque provider
  metadata, and prose omission markers are not returned.


  A successful page may be partial when the serialized transport budget is
  reached. Follow its exact `continuationRequest`: a page continuation supplies
  the next `offset`; a result-slice continuation supplies `result_handle`,
  `result_cursor`, and `result_limit`. Do not infer a continuation or reread an
  overlapping range.


  ## Context-heavy guard


  `verbose: true` or `include_tool_results: true` is rejected before fetching
  unless `limit` is explicitly supplied as an integer from 1 through 10.
  Ordinary compact reads keep their normal paging defaults. Prefer targeted
  result-handle slices over broad result-including pages.


  ## Structured errors


  Transcript errors preserve the established `{ error, detail? }` tool result.
  Existing codes include `session_not_found`, `transcript_unavailable`,
  `invalid_regex`, and `invalid_params`. Result slicing adds
  `INVALID_RESULT_HANDLE`, `RESULT_NOT_FOUND`, `STALE_RESULT_HANDLE`,
  `INVALID_RESULT_CURSOR`, and `INVALID_RESULT_LIMIT`. Heavy-read rejection uses
  `{ error, code: "CONTEXT_HEAVY_LIMIT_REQUIRED" }` and sends no request.


  ## Examples


  ```text

  # Small compact tail
  read_session(session_id="abc-123", offset=-8, limit=8)

  # Search compact metadata before reading any result text
  read_session(session_id="abc-123", pattern="TypeError|failed", context=1, limit=6)

  # Retrieve one bounded excerpt from a returned handle
  read_session(
    session_id="abc-123",
    result_handle="rs1:m6h:b0:NUBAzC7icgMYwEPyuR8OFQyx29U",
    result_cursor=0,
    result_limit=2048
  )

  # Continue only if the first excerpt was insufficient
  read_session(
    session_id="abc-123",
    result_handle="rs1:m6h:b0:NUBAzC7icgMYwEPyuR8OFQyx29U",
    result_cursor=2048,
    result_limit=2048
  )

  ```
