name: read_branch_diff
description: "Read a bounded page from the immutable Systems review branch snapshot."
summary: "Read evidence"
params: [operation, repo_id?, change_id?, side?, path?, paths?, query?, cursor?, limit?]
promptParams: []
provider:
  type: bobbit-extension
  extension: extension.ts
group: Systems Review
grantPolicy: never
docs: |-
  Read-only, receipt-bearing access to the immutable snapshot bound to this Systems review. Operations: `repos`, `manifest`, `patch`, `file`, `list`, `search`, and `coverage`. Follow every returned cursor until `nextCursor` is absent. Pages are limited to 200 records and 48 KiB.
detail_docs: |-
  Every response is bound to the current verification session, gate signal, snapshot digest, operation, object, and range. Cite returned receipt tokens in structured trace locations. Cursors are opaque and cannot be reused across operations, objects, sessions, or signals. Coverage records expose only server-attested `eligibleTargetAssertions`; use their opaque `assertionId` only for the matching action and coverage item. An empty list means exact final-target proof is unavailable and the action must fail closed.

  `patch` requires `change_id`. `file` requires `repo_id`, `side` (`base` or `head`), and `path`. `list` requires `repo_id` and `side`; `path` is an optional tree prefix. `search` requires `repo_id`, `side`, a literal `query`, and one to fifty `paths`. Other operations are paginated inventories.
