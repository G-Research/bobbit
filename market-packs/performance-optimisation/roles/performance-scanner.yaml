  perf_coverage_refresh: allow
  perf_coverage_get_modules_to_scan: allow
  perf_coverage_mark_module_as: allow
  perf_coverage_get_attempts: allow
  perf_coverage_upsert_cross_cutting_unit: allow
  perf_programme_get_settings: allow
  perf_programme_get_activity: allow
  "Agent": never
  team_delegate: allow
  team_wait: allow
  team_prompt: allow
  team_steer: allow
  team_abort: allow
  team_dismiss: allow
  read_session: allow
  "File System": never
