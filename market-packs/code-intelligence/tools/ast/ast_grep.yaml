detail_docs: |-
  ## Purpose

  `ast_grep` performs read-only structural search with the maintained ast-grep CLI.
  It understands syntax, so patterns can use metavariables such as
  `console.log($$$ARGS)` without matching comments or strings.

  ## When to use other tools

  Use `grep` for plain text, regular expressions, or broad discovery. Use `read`
  for surrounding source or a small known file. `ast_grep` is not an editor: it
  never rewrites files.

  ## Inputs

  `paths` are existing working-directory-relative files or directories and default
  to `.`. `language` is an optional supported alias; omitted languages are detected
  from the paths. `strictness` controls ast-grep matching and defaults to `smart`.
  The pattern must parse in the selected language.
