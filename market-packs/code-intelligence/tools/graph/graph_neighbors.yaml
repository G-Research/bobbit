name: graph_neighbors
group: Graph
summary: List bounded incoming or outgoing graph neighbours.
description: Read-only Graphify breadth leads for node neighbours; read cited source and callers before review findings.
params: [node, direction, component, maxResults, maxDepth]
provider:
  type: bobbit-extension
  extension: extension.ts
examples:
  - graph_neighbors node=GraphQueryService direction=outgoing maxResults=25
notes:
  - direction is incoming, outgoing, or both.
