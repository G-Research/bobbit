name: graph_path
group: Graph
summary: Find bounded graph paths between two nodes.
description: Read-only Graphify path lookup within each eligible component; it never creates cross-repository edges.
params: [from, to, component, maxDepth]
provider:
  type: bobbit-extension
  extension: extension.ts
examples:
  - graph_path from=GraphRuntime to=GraphStore maxDepth=4
notes:
  - Results are bounded and component-labelled.
