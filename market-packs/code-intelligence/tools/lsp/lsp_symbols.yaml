name: lsp_symbols
description: "List document or workspace symbols through an enabled language service."
summary: "Read-only LSP symbol queries"
params: ["component?", language, "path? | query?"]
provider:
  type: bobbit-extension
  extension: extension.ts
group: Code Intelligence
docs: |-
  `lsp_document_symbols` reads symbols in one file. `lsp_workspace_symbols`
  searches the selected language workspace. Both require an enabled, ready LSP
  service and never start one.
