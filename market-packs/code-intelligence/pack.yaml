schema: 2
name: code-intelligence
description: >-
  Host-side Graphify code intelligence for component-scoped code graphs. Graph
  queries are read-only, default to code-tier results, and never expose graph
  artifacts to agent sandboxes.
version: 0.1.0
# The pack ships inert. Enabling it is the sole activation switch for its
# provider, graph tools, routes, and status panel.
defaultDisabled: true
contents:
  roles: []
  tools: [graph]
  skills: []
  entrypoints: [code-intelligence-route]
  providers: [indexer]
  hooks: []
  mcp: []
  pi-extensions: []
  runtimes: []
  workflows: []
provides: []
requires: []
# Pack-level routes are the host/RPC boundary. Their names intentionally remain
# small: status carries read-only graph query operations, config declares the
# effective runtime boundary, and rebuild is the bounded manual route surface.
routes:
  module: lib/routes.mjs
  names: [status, config, rebuild]
