# Hindsight declares an endpoint consumer contract. The service supervisor owns all
# lifecycle work; this descriptor supplies only validated runner inputs.
apiVersion: 1
id: hindsight
title: Hindsight
endpoint:
  protocol: http
  servicePort: 8888
  health:
    path: /health
    expectedStatus: 200
    requestTimeoutMs: 1500
    intervalMs: 1000
    startupTimeoutMs: 120000
lifecycle:
  startPolicy: manual
  restart:
    policy: on-failure
    maxAttempts: 3
    windowMs: 300000
    initialBackoffMs: 1000
    maxBackoffMs: 30000
environment:
  # The provider settings owner resolves this only for explicit starts.
  HINDSIGHT_API_LLM_API_KEY:
    secret: llmApiKey
  # Generated credentials remain in the runtime secret sink, never metadata.
  HINDSIGHT_DB_PASSWORD:
    generatedSecret: databasePassword
  # Local launch receives the supervisor-selected listener port through this key.
  HINDSIGHT_API_PORT:
    endpointPort: true
  HINDSIGHT_DATA_DIR:
    setting: dataDir
storage:
  setting: dataDir
  target: /var/lib/postgresql/data
  survival: preserve
modes:
  local:
    command: hindsight
    args: [serve]
    portEnv: HINDSIGHT_API_PORT
  docker:
    image: ghcr.io/vectorize-io/hindsight:latest@sha256:274704505b2720ac9a5c816c559044c1e8c6b51d47017317ae049ed2952f5ab1
  compose:
    file: runtime/compose.yaml
    service: api
    projectName: bobbit-${serverIdentity}-${packId}-${runtimeId}
