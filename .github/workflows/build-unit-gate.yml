name: Build & Unit Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, type-check, unit (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0']
        include:
          - os: ubuntu-latest
            node: '26.x'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unit gate
        run: npm run test:unit
        # Hosted Windows repeatedly exceeded per-file wall budgets with two
        # workers after the first universal native pack joined the built-in band.
        # Serialize there; an empty value elsewhere preserves the normal cap.
        env:
          VITEST_MAX_WORKERS: ${{ runner.os == 'Windows' && '1' || '' }}

  browser:
    name: Browser (${{ matrix.os }}, Node 22.19.0)
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Hosted Windows showed event-loop starvation at two concurrent Browser
        # workers; keep the less constrained Linux and macOS runners at two.
        include:
          - os: ubuntu-latest
            workers: 2
          - os: windows-latest
            workers: 1
          - os: macos-latest
            workers: 2
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium with dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Browser gate
        run: npm run test:browser
        env:
          BOBBIT_V2_PLAYWRIGHT_WORKERS: ${{ matrix.workers }}

  e2e:
    name: E2E (${{ matrix.os }}, Node 22.19.0)
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    # Hosted Windows can spend over nine minutes preparing the lock-free packed
    # consumer before the authoritative suite begins, then runs Browser-backed
    # groups serially to avoid gateway fixture starvation.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install
        run: npm ci

      # npm ci caches locked content, but not every packument/artifact selected by
      # a fresh lock-free consumer. Registry access stays in dependency preparation;
      # the authoritative packed-consumer E2E remains strict offline.
      - name: Warm packed-consumer npm cache
        run: node scripts/testing-v2/prewarm-packed-consumer-cache.mjs

      - name: Install Chromium with dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      # Hosted Linux has Docker, so construct the version-matched image required by
      # image-backed E2E cases. Other runners retain the non-Docker E2E coverage.
      - name: Build sandbox image
        if: runner.os == 'Linux'
        run: |
          PI_AGENT_VERSION=$(node -p "require('./package.json').dependencies['@earendil-works/pi-coding-agent']")
          docker build --build-arg "PI_AGENT_VERSION=$PI_AGENT_VERSION" -t bobbit-agent docker/

      - name: E2E gate
        run: npm run test:e2e
        env:
          E2E_V2_PW_WORKERS: ${{ runner.os == 'Windows' && '1' || '' }}

  release-contract:
    name: Release contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Validate release contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release/validate-release-commit.mjs --mode pre-merge --pull-request "$PR_NUMBER"
